<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="50%" stop-color="#0d1527"/>
      <stop offset="100%" stop-color="#080c18"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="cyanPurpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <linearGradient id="dangerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff416c"/>
      <stop offset="100%" stop-color="#ff4b2b"/>
    </linearGradient>

    <!-- Filters for Glowing Effects -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowRed" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1f2d4d" stroke-width="0.75" stroke-opacity="0.4"/>
      <circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity="0.3"/>
    </pattern>
  </defs>

  <style>
    .title-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 900;
      font-size: 44px;
      letter-spacing: 2px;
      fill: #ffffff;
    }
    .subtitle-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 16px;
      letter-spacing: 3px;
      fill: #94a3b8;
      text-transform: uppercase;
    }
    .badge-pill {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      font-weight: 600;
      font-size: 12px;
      letter-spacing: 1px;
    }
    .attack-line {
      stroke-dasharray: 8, 8;
      animation: dashMove 2.5s linear infinite;
    }
    .fast-attack-line {
      stroke-dasharray: 6, 6;
      animation: dashMove 1.5s linear infinite;
    }
    @keyframes dashMove {
      to {
        stroke-dashoffset: -32;
      }
    }
    @keyframes pulseNode {
      0% { r: 6; opacity: 0.6; }
      50% { r: 12; opacity: 0.2; }
      100% { r: 6; opacity: 0.6; }
    }
    .pulsing-halo {
      animation: pulseNode 3s ease-in-out infinite;
    }
    .pulsing-halo-red {
      animation: pulseNode 2s ease-in-out infinite;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" fill="url(#bgGrad)"/>
  
  <!-- Cyber Grid Overlay -->
  <rect width="1200" height="360" fill="url(#grid)"/>

  <!-- Background Ambience Glows -->
  <circle cx="150" cy="180" r="180" fill="#00f2fe" opacity="0.06" filter="url(#glow)"/>
  <circle cx="1050" cy="180" r="220" fill="#a855f7" opacity="0.08" filter="url(#glow)"/>
  <circle cx="920" cy="100" r="140" fill="#ff416c" opacity="0.07" filter="url(#glow)"/>

  <!-- Attack Graph Visualization (Left & Right Network Mesh) -->
  <g opacity="0.85">
    <line x1="80" y1="280" x2="160" y2="200" stroke="#38bdf8" stroke-width="1.5" opacity="0.4"/>
    <line x1="160" y1="200" x2="110" y2="100" stroke="#00f2fe" stroke-width="2" class="attack-line" stroke-opacity="0.8"/>
    <line x1="80" y1="280" x2="220" y2="290" stroke="#64748b" stroke-width="1.5" opacity="0.4"/>
    <line x1="160" y1="200" x2="220" y2="290" stroke="#64748b" stroke-width="1.2" opacity="0.3"/>
    <line x1="110" y1="100" x2="240" y2="130" stroke="#38bdf8" stroke-width="1.5" opacity="0.5"/>
    <line x1="220" y1="290" x2="240" y2="130" stroke="#818cf8" stroke-width="1.5" class="attack-line" stroke-opacity="0.6"/>

    <circle cx="80" cy="280" r="5" fill="#38bdf8"/>
    <circle cx="160" cy="200" r="7" fill="#00f2fe" filter="url(#glow)"/>
    <circle cx="160" cy="200" r="11" fill="none" stroke="#00f2fe" class="pulsing-halo"/>
    <circle cx="110" cy="100" r="6" fill="#38bdf8"/>
    <circle cx="220" cy="290" r="5" fill="#64748b"/>
    <circle cx="240" cy="130" r="6" fill="#818cf8" filter="url(#glow)"/>

    <text x="80" y="302" fill="#64748b" font-size="10" font-family="monospace" text-anchor="middle">RECON</text>
    <text x="160" y="180" fill="#38bdf8" font-size="11" font-family="monospace" text-anchor="middle" font-weight="bold">ENTRY_POINT</text>
    <text x="110" y="85" fill="#64748b" font-size="10" font-family="monospace" text-anchor="middle">PIVOT_HOST</text>
  </g>

  <!-- Right Graph: Critical Asset Target Attack Vector -->
  <g opacity="0.9">
    <line x1="960" y1="280" x2="1010" y2="190" stroke="#a855f7" stroke-width="1.5" opacity="0.4"/>
    <line x1="1010" y1="190" x2="1110" y2="240" stroke="#64748b" stroke-width="1.2" opacity="0.3"/>
    <line x1="1010" y1="190" x2="1060" y2="100" stroke="#ff416c" stroke-width="2.5" class="fast-attack-line" stroke-opacity="0.9" filter="url(#glowRed)"/>
    <line x1="930" y1="110" x2="1060" y2="100" stroke="#ff416c" stroke-width="2" class="attack-line" stroke-opacity="0.7"/>
    <line x1="960" y1="280" x2="930" y2="110" stroke="#a855f7" stroke-width="1.5" class="attack-line" stroke-opacity="0.5"/>

    <circle cx="960" cy="280" r="5" fill="#a855f7"/>
    <circle cx="930" cy="110" r="6" fill="#c084fc"/>
    <circle cx="1010" cy="190" r="7" fill="#f43f5e" filter="url(#glow)"/>
    <circle cx="1010" cy="190" r="12" fill="none" stroke="#f43f5e" class="pulsing-halo-red"/>
    <circle cx="1110" cy="240" r="4" fill="#64748b"/>
    
    <!-- Crown Jewel Node -->
    <circle cx="1060" cy="100" r="14" fill="#ff4b2b" filter="url(#glowRed)"/>
    <circle cx="1060" cy="100" r="22" fill="none" stroke="#ff416c" stroke-width="1.5" class="pulsing-halo-red"/>
    <polygon points="1060,93 1066,97 1064,105 1056,105 1054,97" fill="#ffffff"/>

    <text x="1010" y="215" fill="#fb7185" font-size="10" font-family="monospace" text-anchor="middle">IAM_ESCALATION</text>
    <text x="1060" y="75" fill="#ff4b2b" font-size="12" font-family="monospace" text-anchor="middle" font-weight="bold">👑 CROWN_JEWEL</text>
  </g>

  <!-- Central Header Branding Area -->
  <g transform="translate(600, 115)" text-anchor="middle">
    <rect x="-190" y="-55" width="380" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5"/>
    <circle cx="-168" cy="-41" r="4" fill="#22c55e">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="5" y="-37" fill="#38bdf8" class="badge-pill" text-anchor="middle">CURATED CYBERSECURITY GRAPH DIRECTORY</text>

    <!-- Main Title with Gradient -->
    <text x="0" y="20" class="title-text" filter="url(#glow)">AWESOME ATTACK PATH ANALYSIS</text>
    <text x="0" y="20" class="title-text" fill="url(#cyanPurpleGrad)">AWESOME ATTACK PATH ANALYSIS</text>

    <!-- Subtitle -->
    <text x="0" y="60" class="subtitle-text">Attack Graphs • Exposure Management • Cloud IAM • Threat Emulation</text>

    <!-- Decorative Badges in Header SVG -->
    <g transform="translate(0, 95)">
      <g transform="translate(-230, 0)">
        <rect x="-75" y="-12" width="150" height="26" rx="6" fill="#0f172a" stroke="#00f2fe" stroke-width="1" stroke-opacity="0.6"/>
        <text x="0" y="5" fill="#e2e8f0" font-size="11" font-family="sans-serif" font-weight="600" text-anchor="middle">⚡ Security Graphs</text>
      </g>
      <g transform="translate(-75, 0)">
        <rect x="-65" y="-12" width="130" height="26" rx="6" fill="#0f172a" stroke="#818cf8" stroke-width="1" stroke-opacity="0.6"/>
        <text x="0" y="5" fill="#e2e8f0" font-size="11" font-family="sans-serif" font-weight="600" text-anchor="middle">🔑 Cloud IAM / AD</text>
      </g>
      <g transform="translate(75, 0)">
        <rect x="-65" y="-12" width="130" height="26" rx="6" fill="#0f172a" stroke="#c084fc" stroke-width="1" stroke-opacity="0.6"/>
        <text x="0" y="5" fill="#e2e8f0" font-size="11" font-family="sans-serif" font-weight="600" text-anchor="middle">🛡️ CTEM &amp; BAS</text>
      </g>
      <g transform="translate(230, 0)">
        <rect x="-75" y="-12" width="150" height="26" rx="6" fill="#0f172a" stroke="#22c55e" stroke-width="1" stroke-opacity="0.6"/>
        <text x="0" y="5" fill="#e2e8f0" font-size="11" font-family="sans-serif" font-weight="600" text-anchor="middle">🌟 Open-Source Core</text>
      </g>
    </g>
  </g>

  <!-- Glowing Border Line at Bottom -->
  <line x1="100" y1="358" x2="1100" y2="358" stroke="url(#cyanPurpleGrad)" stroke-width="2" opacity="0.7"/>
</svg>
